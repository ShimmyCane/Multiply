<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add and Multiply</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF9F0;
    --add-a: #FF6B6B; --add-a-b: #E05555;
    --add-b: #FFD166; --add-b-b: #E0A820;
    --mul:   #4ECDC4; --mul-b:   #3AB9B0;
    --grid-border: #E8D5C0;
    --text-dark: #2D2D2D;
    --shadow: 0 4px 0 rgba(0,0,0,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 10px 90px;
    background-image:
      radial-gradient(circle at 20% 20%, #FFE4E1 0%, transparent 40%),
      radial-gradient(circle at 80% 80%, #E0F7FA 0%, transparent 40%);
    user-select: none;
  }

  h1 {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.8rem, 4vw, 2.8rem);
    color: var(--text-dark);
    margin-bottom: 4px;
    letter-spacing: 1px;
  }
  .subtitle {
    font-size: 0.85rem;
    color: #AAA;
    margin-bottom: 22px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  /* ── number pickers ── */
  .controls {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .num-box { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .num-label {
    font-family: 'Fredoka One', cursive;
    font-size: 0.85rem; color: #AAA;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .num-control {
    display: flex; align-items: center;
    background: white; border-radius: 50px;
    box-shadow: var(--shadow); overflow: hidden;
    border: 3px solid var(--grid-border);
  }
  .num-btn {
    width: 44px; height: 44px;
    font-size: 1.4rem; font-weight: 900;
    border: none; background: transparent;
    cursor: pointer; color: var(--text-dark);
    font-family: 'Fredoka One', cursive;
    line-height: 1; touch-action: none;
    -webkit-user-select: none;
  }
  .num-btn:hover  { background: #F0F0F0; }
  .num-btn:active { background: #E4E4E4; }

  .num-display {
    font-family: 'Fredoka One', cursive;
    font-size: 1.6rem; min-width: 48px;
    text-align: center; color: var(--text-dark);
    transition: transform 0.08s;
  }
  .num-display.bump { transform: scale(1.3); }

  .divider {
    font-family: 'Fredoka One', cursive;
    font-size: 1.8rem; color: #CCC;
  }

  /* ── mode toggle pill ── */
  .toggle-pill {
    display: flex; background: white;
    border-radius: 24px; padding: 5px; gap: 5px;
    box-shadow: 0 5px 0 rgba(0,0,0,0.10);
    border: 3px solid var(--grid-border);
    margin-bottom: 18px;
  }
  .op-btn {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 22px; border-radius: 18px; border: none;
    font-family: 'Fredoka One', cursive; font-size: 1.15rem;
    cursor: pointer; color: #BBB; background: transparent;
    transition: background 0.2s, color 0.2s, transform 0.1s, box-shadow 0.1s;
    letter-spacing: 0.5px;
  }
  .op-btn .sym { font-size: 1.5rem; line-height: 1; }
  .op-btn.add.active { background: var(--add-a); color: white; box-shadow: 0 4px 0 #CC4444; transform: translateY(-1px); }
  .op-btn.mul.active { background: var(--mul);   color: white; box-shadow: 0 4px 0 #2AA099; transform: translateY(-1px); }
  .op-btn:not(.active):hover { background: #F5F0EA; color: #888; }

  /* ── grid ── */
  .grid-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }

  #grid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 4px; padding: 14px;
    background: white; border-radius: 20px;
    box-shadow: 0 8px 0 rgba(0,0,0,0.10);
    border: 3px solid var(--grid-border);
    position: relative;
  }
  #grid.clickable { cursor: pointer; }

  .cell {
    width: min(44px, calc((100vw - 92px) / 10));
    height: min(44px, calc((100vw - 92px) / 10));
    border-radius: 6px;
    background: #F5EFE6;
    border: 2px solid var(--grid-border);
    transition: background 0.15s, border-color 0.15s;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Fredoka One', cursive;
    font-size: clamp(0.58rem, 1.1vw, 0.76rem);
    color: transparent;
    position: relative;
  }

  /* ── colored states ── */
  .cell.ca  { background: var(--add-a); border-color: var(--add-a-b); }
  .cell.cb  { background: var(--add-b); border-color: var(--add-b-b); }
  .cell.cm  { background: var(--mul);   border-color: var(--mul-b);   }
  /* group cells: bg/border set inline by JS */

  /* reveal numbers on hover (add / rect modes) */
  #grid:hover .cell.ca, #grid.nums .cell.ca { color: rgba(255,255,255,0.75); }
  #grid:hover .cell.cb, #grid.nums .cell.cb { color: rgba(110,70,0,0.65); }
  #grid:hover .cell.cm, #grid.nums .cell.cm { color: rgba(255,255,255,0.75); }

  /* last cell: 50% bigger, bold inner ring */
  .cell.last {
    font-size: clamp(0.9rem, 1.7vw, 1.14rem);
    box-shadow: inset 0 0 0 3px rgba(255,255,255,0.65);
  }
  #grid:hover .cell.ca.last, #grid.nums .cell.ca.last { color: white; }
  #grid:hover .cell.cb.last, #grid.nums .cell.cb.last { color: rgba(90,55,0,0.95); }
  #grid:hover .cell.cm.last, #grid.nums .cell.cm.last { color: white; }

  /* group cells: suppress text, show tooltip on individual cell hover */
  .cell.cg {
    color: transparent !important;
    overflow: visible;
  }
  /* group edge outlines (white border on outer sides of each group) */
  .cell.ge-t { border-top:    3px solid rgba(255,255,255,0.9); }
  .cell.ge-b { border-bottom: 3px solid rgba(255,255,255,0.9); }
  .cell.ge-l { border-left:   3px solid rgba(255,255,255,0.9); }
  .cell.ge-r { border-right:  3px solid rgba(255,255,255,0.9); }

  .cell.cg::after {
    content: attr(data-tip);
    position: absolute;
    bottom: calc(100% + 7px);
    left: 50%; transform: translateX(-50%);
    background: rgba(20,15,5,0.88);
    color: white;
    font-family: 'Fredoka One', cursive;
    font-size: 0.72rem;
    white-space: nowrap;
    padding: 4px 10px;
    border-radius: 8px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s;
    z-index: 20;
  }
  .cell.cg:hover::after { opacity: 1; }

  /* ── legend ── */
  .legend {
    display: flex; gap: 12px;
    flex-wrap: wrap; justify-content: center;
    min-height: 20px;
  }
  .legend-item {
    display: flex; align-items: center; gap: 5px;
    font-size: 0.8rem; font-weight: 700; color: #555;
  }
  .ldot { width: 13px; height: 13px; border-radius: 3px; flex-shrink: 0; }

  /* ── click hint ── */
  .click-hint {
    font-size: 0.78rem; font-weight: 700;
    color: #BBB; text-align: center; min-height: 1.1em;
  }

  /* ── equation card ── */
  .eq-card {
    margin-top: 20px;
    background: white; border-radius: 22px;
    padding: 16px 34px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.10);
    border: 3px solid var(--grid-border);
    text-align: center; min-width: 210px;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .eq-card.mode-add { border-color: var(--add-a); box-shadow: 0 6px 0 #CC4444; }
  .eq-card.mode-mul { border-color: var(--mul);   box-shadow: 0 6px 0 #2AA099; }

  .eq-label {
    font-size: 0.7rem; font-weight: 900;
    text-transform: uppercase; letter-spacing: 1.5px;
    color: #BBB; margin-bottom: 6px;
  }
  .eq-text {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.8rem, 4vw, 2.5rem);
    color: var(--text-dark);
    display: flex; align-items: center;
    justify-content: center; gap: 6px;
  }
  .eq-text .op  { color: #CCC; }
  .eq-text .ans { transition: color 0.3s; }
  .mode-add .eq-text .op, .mode-add .eq-text .ans { color: var(--add-a); }
  .mode-mul .eq-text .op, .mode-mul .eq-text .ans { color: var(--mul); }

  /* ── read-aloud bar ── */
  .audio-bar {
    margin-top: 16px;
    display: flex; align-items: center; gap: 10px;
    background: white; border-radius: 50px;
    padding: 8px 20px;
    box-shadow: var(--shadow);
    border: 3px solid var(--grid-border);
  }
  .audio-icon { font-size: 1.2rem; line-height: 1; opacity: 0.4; transition: opacity 0.2s; }
  .audio-bar.on .audio-icon.on-icon { opacity: 1; }
  .audio-bar:not(.on) .audio-icon.off-icon { opacity: 0.8; }

  .audio-lbl {
    font-family: 'Fredoka One', cursive;
    font-size: 0.95rem; color: #BBB;
    transition: color 0.2s;
  }
  .audio-bar.on .audio-lbl { color: var(--text-dark); }

  /* toggle switch */
  .sw { position: relative; width: 50px; height: 26px; cursor: pointer; flex-shrink: 0; }
  .sw input { opacity: 0; width: 0; height: 0; position: absolute; }
  .sw-track {
    position: absolute; inset: 0;
    background: #DDD; border-radius: 50px;
    transition: background 0.2s;
  }
  .sw input:checked ~ .sw-track { background: var(--mul); }
  .sw-thumb {
    position: absolute; top: 3px; left: 3px;
    width: 20px; height: 20px;
    background: white; border-radius: 50%;
    box-shadow: 0 1px 4px rgba(0,0,0,0.25);
    transition: transform 0.2s;
  }
  .sw input:checked ~ .sw-thumb { transform: translateX(24px); }

  /* ── corner link to 2.0 ── */
  .v2-link {
    position: fixed; right: 16px; bottom: 16px; z-index: 50;
    display: flex; align-items: center; gap: 6px;
    padding: 12px 18px; border-radius: 50px;
    background: var(--mul); color: white; text-decoration: none;
    font-family: 'Fredoka One', cursive; font-size: 1.1rem;
    box-shadow: 0 5px 0 #2AA099;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .v2-link:hover  { transform: translateY(-2px); box-shadow: 0 7px 0 #2AA099; }
  .v2-link:active { transform: translateY(3px);  box-shadow: 0 2px 0 #2AA099; }
  .v2-link .sym { font-size: 1.4rem; line-height: 1; }
  @media (max-width: 500px) { .v2-link { padding: 9px 14px; font-size: 1rem; } }
</style>
</head>
<body>

<h1>Add and Multiply</h1>
<p class="subtitle">v1.3.0</p>

<!-- pickers -->
<div class="controls">
  <div class="num-box">
    <span class="num-label">First number</span>
    <div class="num-control">
      <button class="num-btn" id="btnAminus">−</button>
      <span class="num-display" id="dispA">5</span>
      <button class="num-btn" id="btnAplus">+</button>
    </div>
  </div>
  <span class="divider">and</span>
  <div class="num-box">
    <span class="num-label">Second number</span>
    <div class="num-control">
      <button class="num-btn" id="btnBminus">−</button>
      <span class="num-display" id="dispB">8</span>
      <button class="num-btn" id="btnBplus">+</button>
    </div>
  </div>
</div>

<!-- mode toggle -->
<div class="toggle-pill">
  <button class="op-btn add active" id="btnAdd" onclick="setMode('add')">
    <span class="sym">+</span> Add
  </button>
  <button class="op-btn mul" id="btnMul" onclick="setMode('mul')">
    <span class="sym">×</span> Multiply
  </button>
</div>

<!-- grid -->
<div class="grid-wrap">
  <div id="grid"></div>
  <div class="legend" id="legend"></div>
  <div class="click-hint" id="hint"></div>
</div>

<!-- equation -->
<div class="eq-card mode-add" id="eqCard">
  <div class="eq-label" id="eqLabel">➕ Add</div>
  <div class="eq-text">
    <span id="eqA">5</span>
    <span class="op" id="eqOp">+</span>
    <span id="eqB">8</span>
    <span class="op">=</span>
    <span class="ans" id="eqAns">13</span>
  </div>
</div>

<!-- read aloud -->
<div class="audio-bar" id="audioBar">
  <span class="audio-icon off-icon">🔇</span>
  <label class="sw">
    <input type="checkbox" id="audioChk">
    <div class="sw-track"></div>
    <div class="sw-thumb"></div>
  </label>
  <span class="audio-icon on-icon">🔊</span>
  <span class="audio-lbl">Read aloud</span>
</div>

<a class="v2-link" href="multiply2.html" title="Multiplication 2.0"><span class="sym">×</span> 2.0 →</a>

<script>
// ── state ─────────────────────────────────────────────────
let numA = 5, numB = 8;
let mode = 'add';          // 'add' | 'mul'
let mulView = 'rect';      // 'rect' | 'groups-a' (rows are groups) | 'groups-b' (columns are groups)
let audioOn = false;
let holdTimer = null, holdInterval = null;
let floodTimers = [];

// ── palette (10 colors) ───────────────────────────────────
const PAL = [
  ['#FF6B6B','#D94F4F'],
  ['#FFD166','#C9A010'],
  ['#4ECDC4','#2FAF9F'],
  ['#A78BFA','#7050D0'],
  ['#F97316','#C05808'],
  ['#34D399','#18A06A'],
  ['#60A5FA','#2A70D0'],
  ['#F472B6','#C03880'],
  ['#FACC15','#C09000'],
  ['#86EFAC','#3A9A60'],
];

function ordinal(n) {
  const v = n % 100;
  const sfx = ['th','st','nd','rd'];
  return n + (sfx[(v - 20) % 10] || sfx[v] || sfx[0]);
}

// ── build grid ────────────────────────────────────────────
const gridEl = document.getElementById('grid');
const cells = [];
for (let i = 0; i < 100; i++) {
  const d = document.createElement('div');
  gridEl.appendChild(d);
  cells.push(d);
}

// ── cell data for current state ───────────────────────────
// returns { cls, groupIdx, num, last } or null
function cellData(idx) {
  const r = Math.floor(idx / 10), c = idx % 10;

  if (mode === 'add') {
    if (idx < numA)           return { cls:'ca', groupIdx:-1, num:idx+1,   last: idx===numA-1 };
    if (idx < numA+numB)      return { cls:'cb', groupIdx:-1, num:idx+1,   last: idx===numA+numB-1 };
    return null;
  }

  if (mulView === 'rect') {
    if (r < numA && c < numB) return { cls:'cm', groupIdx:-1, num:r*numB+c+1, last: r===numA-1&&c===numB-1 };
    return null;
  }

  // groups-a: each row is a group of numB; groups-b: each column is a group of numA
  if (r >= numA || c >= numB) return null;
  const gIdx = mulView === 'groups-a' ? r : c;
  return { cls:'cg', groupIdx: gIdx, num: r*numB+c+1, last: r===numA-1&&c===numB-1 };
}

// ── apply one cell ────────────────────────────────────────
function applyCell(idx) {
  const cell = cells[idx];
  // reset
  cell.className = 'cell';
  cell.style.cssText = '';
  cell.removeAttribute('data-tip');
  cell.textContent = '';

  const d = cellData(idx);
  if (!d) return;

  cell.classList.add(d.cls);
  if (d.last) cell.classList.add('last');

  if (d.groupIdx >= 0) {
    const [bg, bdr] = PAL[d.groupIdx % PAL.length];
    cell.style.background = bg;
    cell.style.borderColor = bdr;

    // tooltip
    const size = mulView === 'groups-a' ? numB : numA;
    cell.setAttribute('data-tip', `${ordinal(d.groupIdx + 1)} group of ${size}`);

    // edge outlines on the outer sides of each row / column group
    const r = Math.floor(idx / 10), c = idx % 10;
    if (mulView === 'groups-a') {
      cell.classList.add('ge-t', 'ge-b');
      if (c === 0)      cell.classList.add('ge-l');
      if (c === numB-1) cell.classList.add('ge-r');
    } else {
      cell.classList.add('ge-l', 'ge-r');
      if (r === 0)      cell.classList.add('ge-t');
      if (r === numA-1) cell.classList.add('ge-b');
    }

  } else {
    cell.textContent = d.num;
  }
}

// ── flood animation ───────────────────────────────────────
function flood() {
  floodTimers.forEach(clearTimeout);
  floodTimers = [];
  for (let r = 0; r < 10; r++) {
    for (let c = 0; c < 10; c++) {
      const idx = r*10+c;
      const delay = Math.max(0, ((r+c)/18)*500 + (Math.random()-0.5)*35);
      floodTimers.push(setTimeout(() => applyCell(idx), delay));
    }
  }
}

function renderNow() {
  floodTimers.forEach(clearTimeout);
  floodTimers = [];
  cells.forEach((_, i) => applyCell(i));
}

// ── UI update ─────────────────────────────────────────────
function updateUI() {
  // equation card
  const card = document.getElementById('eqCard');
  card.className = 'eq-card ' + (mode==='add' ? 'mode-add' : 'mode-mul');
  document.getElementById('eqLabel').textContent = mode==='add' ? '➕ Add' : '✖️ Multiply';
  document.getElementById('eqOp').textContent    = mode==='add' ? '+' : '×';
  document.getElementById('eqA').textContent     = numA;
  document.getElementById('eqB').textContent     = numB;
  document.getElementById('eqAns').textContent   = mode==='add' ? numA+numB : numA*numB;

  // grid cursor
  gridEl.classList.add('clickable');

  // legend + hint
  const leg  = document.getElementById('legend');
  const hint = document.getElementById('hint');

  if (mode === 'add') {
    leg.innerHTML =
      `<div class="legend-item"><div class="ldot" style="background:var(--add-a)"></div>First group (${numA})</div>` +
      `<div class="legend-item"><div class="ldot" style="background:var(--add-b)"></div>Second group (${numB})</div>`;
    hint.textContent = '👆 Tap the grid to show numbers';
  } else if (mulView === 'rect') {
    leg.innerHTML =
      `<div class="legend-item"><div class="ldot" style="background:var(--mul)"></div>${numA} rows × ${numB} cols = ${numA*numB}</div>`;
    hint.textContent = '👆 Click the grid to see groups';
  } else {
    const groups = mulView==='groups-a' ? numA : numB;
    const size   = mulView==='groups-a' ? numB : numA;
    let swatches = '';
    for (let g = 0; g < groups; g++) {
      swatches += `<div class="legend-item"><div class="ldot" style="background:${PAL[g%PAL.length][0]}"></div>Group ${g+1}</div>`;
    }
    leg.innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center">${swatches}</div>`;
    hint.textContent = `${groups} groups of ${size} = ${numA*numB} · 👆 Click to ` +
      (mulView==='groups-a' ? 'flip' : 'reset');
  }

  speak(phrase());
}

// ── speech ────────────────────────────────────────────────
function phrase() {
  if (mode === 'add')          return `${numA} plus ${numB} equals ${numA+numB}`;
  if (mulView === 'rect')      return `${numA} times ${numB} equals ${numA*numB}`;
  if (mulView === 'groups-a')  return `${numA} groups of ${numB} makes ${numA*numB}`;
  return `${numB} groups of ${numA} also makes ${numA*numB}`;
}

function speak(text) {
  if (!audioOn || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.88; u.pitch = 1.1;
  speechSynthesis.speak(u);
}

document.getElementById('audioChk').addEventListener('change', function() {
  audioOn = this.checked;
  document.getElementById('audioBar').classList.toggle('on', audioOn);
  if (audioOn) speak(phrase());
});

// ── hold-to-repeat buttons ────────────────────────────────
function change(which, delta) {
  if (which === 'a') numA = Math.max(1, Math.min(10, numA + delta));
  else               numB = Math.max(1, Math.min(10, numB + delta));
  const el = document.getElementById(which==='a' ? 'dispA' : 'dispB');
  el.textContent = which==='a' ? numA : numB;
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
  setTimeout(() => el.classList.remove('bump'), 130);
  mulView = 'rect';
  updateUI();
  flood();
}

function attachHold(btnId, which, delta) {
  const btn = document.getElementById(btnId);
  const stop = () => { clearTimeout(holdTimer); clearInterval(holdInterval); };
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    stop();
    btn.setPointerCapture(e.pointerId);
    change(which, delta);
    holdTimer = setTimeout(() => {
      holdInterval = setInterval(() => change(which, delta), 250);
    }, 380);
  });
  btn.addEventListener('pointerup',          stop);
  btn.addEventListener('pointercancel',      stop);
  btn.addEventListener('lostpointercapture', stop);
}

attachHold('btnAminus', 'a', -1);
attachHold('btnAplus',  'a',  1);
attachHold('btnBminus', 'b', -1);
attachHold('btnBplus',  'b',  1);

// ── mode toggle ───────────────────────────────────────────
function setMode(m) {
  if (m === mode) return;
  mode = m; mulView = 'rect';
  gridEl.classList.remove('nums');
  document.getElementById('btnAdd').classList.toggle('active', m==='add');
  document.getElementById('btnMul').classList.toggle('active', m==='mul');
  updateUI(); flood();
}

// ── grid click (multiply group cycling) ──────────────────
gridEl.addEventListener('click', () => {
  if (mode !== 'mul') { gridEl.classList.toggle('nums'); return; }
  mulView = { 'rect':'groups-a', 'groups-a':'groups-b', 'groups-b':'rect' }[mulView];
  updateUI(); flood();
});

// ── init ──────────────────────────────────────────────────
updateUI();
renderNow();
</script>
</body>
</html>
